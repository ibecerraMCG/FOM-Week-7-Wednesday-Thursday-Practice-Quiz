<html lang="en">
<head>
<meta charset="UTF-8">

<title>Week 7 Wednesday & Thursday Practice Quiz</title>
<style>
/* --- Color Variables --- */
:root {
/* Default: Dark Theme */
--bg-color: #2d343e; /* Dark background */
--container-bg: #3c424f; /* Slightly lighter container */
--text-color: #e8e6e3; /* Light text */
--question-text-color: #8ab4f8; /* Light blue for questions */
--lo-text-color: #b0c4de; /* Lighter blue for learning objective */
--border-color: #555; /* Darker borders */
--separator-color: #4a4f5a;
--label-bg: #454c5a;
--label-border: #6c757d;
--label-hover-bg: #525966;
--label-hover-border: #7a828a;
--button-bg: #8ab4f8;
--button-text: #202124;
--button-hover-bg: #a3c5f9;
--button-disabled-bg: #5f6368;
--feedback-correct-bg: #344e41;
--feedback-correct-text: #c7f9cc;
--feedback-correct-border: #52b788;
--feedback-incorrect-bg: #5e2129;
--feedback-incorrect-text: #f8d7da;
--feedback-incorrect-border: #a4133c;
--feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
--feedback-source-text: #c7d3e0;
--feedback-separator: #6c757d;
--radio-accent: #8ab4f8;
}

.light-theme {
    --bg-color: #eef2f7;
    --container-bg: #ffffff;
    --text-color: #343a40;
    --question-text-color: #0056b3;
    --lo-text-color: #5a6e8a;
    --border-color: #dee2e6;
    --separator-color: #e9ecef;
    --label-bg: #f8f9fa;
    --label-border: #ced4da;
    --label-hover-bg: #e2e6ea;
    --label-hover-border: #adb5bd;
    --button-bg: #007bff;
    --button-text: white;
    --button-hover-bg: #0056b3;
    --button-disabled-bg: #6c757d;
    --feedback-correct-bg: #d1e7dd;
    --feedback-correct-text: #0f5132;
    --feedback-correct-border: #badbcc;
    --feedback-incorrect-bg: #f8d7da;
    --feedback-incorrect-text: #842029;
    --feedback-incorrect-border: #f5c2c7;
    --feedback-rationale-text: #495057;
    --feedback-source-text: #343a40;
    --feedback-separator: #ccc;
    --radio-accent: #007bff;
}

/* --- General Styles --- */
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    line-height: 1.7;
    margin: 0;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding-bottom: 40px;
    transition: background-color 0.3s, color 0.3s;
}

#theme-toggle-button {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 8px 12px;
    background-color: var(--button-bg);
    color: var(--button-text);
    border: 1px solid var(--label-border);
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9em;
    z-index: 1000;
     transition: background-color 0.3s, color 0.3s;
}
 #theme-toggle-button:hover {
     opacity: 0.8;
 }


#quiz-container {
    max-width: 900px;
    margin: 80px auto 30px auto;
    background: var(--container-bg);
    padding: 25px 35px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    border: 1px solid var(--border-color);
    transition: background-color 0.3s, border-color 0.3s;
}

.question-block {
    margin-bottom: 35px;
    padding-bottom: 25px;
    border-bottom: 1px solid var(--separator-color);
    transition: border-color 0.3s;
}

.question-block:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 5px;
}

.learning-objective {
    font-size: 0.85em;
    font-style: italic;
    color: var(--lo-text-color);
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--separator-color);
}

.question-text {
    font-weight: 600;
    font-size: 1.1em;
    margin-bottom: 18px;
    color: var(--question-text-color);
    transition: color 0.3s;
}

.options label {
    display: block;
    margin-bottom: 12px;
    cursor: pointer;
    padding: 10px 15px;
    border-radius: 6px;
    border: 1px solid var(--label-border);
    background-color: var(--label-bg);
    transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
}

.options label:hover {
    background-color: var(--label-hover-bg);
    border-color: var(--label-hover-border);
}

.options input[type="radio"]:checked+span {
     font-weight: bold;
     color: var(--question-text-color);
}
.options input[type="radio"] {
    margin-right: 12px;
    accent-color: var(--radio-accent);
}

.button-container {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.check-button {
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.95em;
    transition: background-color 0.2s, color 0.2s, opacity 0.2s;
    background-color: var(--button-bg);
    color: var(--button-text);
}

.check-button:hover {
    opacity: 0.85;
}

 .check-button:disabled {
     background-color: var(--button-disabled-bg);
     cursor: not-allowed;
     opacity: 0.7;
 }

.feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 6px;
    font-size: 0.95em;
    display: none;
    border: 1px solid transparent;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
}

.feedback.correct {
    background-color: var(--feedback-correct-bg);
    color: var(--feedback-correct-text);
    border-color: var(--feedback-correct-border);
    display: block;
}

.feedback.incorrect {
    background-color: var(--feedback-incorrect-bg);
    color: var(--feedback-incorrect-text);
    border-color: var(--feedback-incorrect-border);
    display: block;
}

.feedback-status {
     font-weight: bold;
     font-size: 1.1em;
     display: block;
     margin-bottom: 8px;
}

.feedback-rationale {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--feedback-separator);
    font-size: 0.9em;
    color: var(--feedback-rationale-text);
    transition: color 0.3s, border-color 0.3s;
}

.feedback-source {
    margin-top: 10px;
    font-size: 0.85em;
    font-style: italic;
    color: var(--feedback-source-text);
    background-color: rgba(0,0,0,0.1);
    padding: 8px;
    border-radius: 4px;
}

h1 {
    text-align: center;
    color: var(--question-text-color);
    margin-top: 30px;
    margin-bottom: 30px;
    font-weight: 600;
    transition: color 0.3s;
}

</style>
</head>

<script>
    const quizData = [
    {
        learningObjective: "LO 1 (Viral Structure & Pathogenesis): Describe clinically relevant aspects of viral morphology.",
        question: "A virologist is studying a virus that is easily inactivated by detergents and stomach acid. It is primarily transmitted via respiratory droplets and other body fluids. Based on these characteristics, what is the most likely morphology of this virus?",

            D: "Naked, filamentous"

        correctAnswer: "B",
        rationale: "The fragility of the virus (sensitivity to acid, detergents, drying) is a hallmark characteristic of an enveloped virus. The lipid envelope is easily disrupted, leading to inactivation. Naked (non-enveloped) viruses are typically much more stable and resistant to these conditions and are often transmitted via the fecal-oral route.",
        source: "'Enveloped viruses are: Fragile: Sensitive to acid, detergents, drying & heat... Usually transmitted via body fluids. Not transmitted by fecal/oral route.' (Viral Structure & Pathogenesis, Slide 5)"
    },
    {
        learningObjective: "LO 1 (Viral Structure & Pathogenesis): Describe clinically relevant aspects of viral morphology.",

        options: {
            A: "During entry, from the endosomal membrane",
            B: "During replication, synthesized de novo in the nucleus",
            C: "During release, from the host cell plasma membrane",
            D: "During assembly, from the Golgi apparatus"
        },
        correctAnswer: "C",
        rationale: "Enveloped viruses acquire their lipid bilayer envelope from a host cell membrane. For many viruses, including HIV, this occurs during the final stage of release from the cell, in a process called budding, where the newly assembled virion pushes through and acquires a portion of the host's outer cell membrane.",
        source: "'A portion of host cell membrane. Acquired from host cell during viral replication or release.' (Viral Structure & Pathogenesis, Slide 4)"
    },
    {
        learningObjective: "LO 1 (Viral Structure & Pathogenesis): Describe clinically relevant aspects of viral morphology.",

            A: "Replicating the viral genome",
            B: "Providing structural integrity to the capsid",
            C: "Binding to specific receptors on the host cell",
            D: "Digesting the host cell wall"
        },
        correctAnswer: "C",
        rationale: "The protein/glycoprotein spikes on the viral envelope function as viral attachment proteins (VAPs). They are essential for recognizing and binding to specific surface receptors on the target host cell, which is the first and most critical step in initiating an infection.",

    {

        },

        rationale: "The M2 protein of the influenza virus allows protons to enter the virion after it has been taken into an endosome. This acidification is necessary to disrupt the viral core and release the viral genome into the cytoplasm. Amantadine blocks this M2 channel, trapping the virus in the endosome and preventing the uncoating step.",
        source: "'General Scheme of Viral Replication' diagram shows Amantadine acting at step 4, 'Uncoating'. (Viral Structure & Pathogenesis, Slide 7)"

    {
        learningObjective: "LO 2 (Viral Structure & Pathogenesis): Identify basic steps in the viral replication cycle targeted by antiviral drugs.",

            A: "Entry",
            B: "Uncoating",
            C: "Replication (Reverse Transcription)",
            D: "Assembly/Maturation"
        },
        correctAnswer: "C",
        rationale: "AZT targets the reverse transcriptase enzyme. As a thymidine analogue, it gets incorporated into the DNA chain being synthesized from the viral RNA template. Its structure prevents the addition of subsequent nucleotides, thus terminating DNA synthesis. This falls under the general stage of Replication.",

            A: "Attachment to host cell",
            B: "Membrane fusion",
            C: "Integration into host DNA",
            D: "Assembly and Maturation"

        correctAnswer: "D",

    {

    {

    {

        correctAnswer: "C",

    {
        learningObjective: "LO 5 (Viral Structure & Pathogenesis): Describe modes of transmission of viral infections.",

    {

        source: "'Influenza virus: Flu-like symptoms due to interferon & cytokine production.' (Viral Structure & Pathogenesis, Slide 31)"
    },
    {
        learningObjective: "LO 6 (Viral Structure & Pathogenesis): Discuss the cellular and host immune responses to viral infections.",

            B: "An immune complex-mediated (Type III) hypersensitivity reaction",
            C: "Formation of multinucleated giant cells",
            D: "Antibody-dependent cellular cytotoxicity"
        },
        correctAnswer: "B",
        rationale: "The liver damage in chronic HBV (and HCV) infection is not primarily due to the virus directly killing the cells. Instead, it is an immunopathologic process. The host's immune response to the viral antigens leads to the formation of immune complexes that deposit in the liver (and other sites), causing a Type III hypersensitivity reaction and chronic inflammation.",
        source: "'HBV & HBC: Immune complex, type III hypersensitivity.' (Viral Structure & Pathogenesis, Slide 31)"
    },
    {
        learningObjective: "LO 6 (Viral Structure & Pathogenesis): Discuss the cellular and host immune responses to viral infections.",

        source: "'Serology – IgM (acute infection); IgG prior exposure based on Ab to gpG.' (Herpesvirus Infections, Slide 10)"

    {

    const quizContainer = document.getElementById('quiz-container');
    const themeToggleButton = document.getElementById('theme-toggle-button');
    const bodyElement = document.body;

    function applyTheme(theme) {
        if (theme === 'light') {
            bodyElement.classList.add('light-theme');
            themeToggleButton.textContent = 'Switch to Dark Mode';
        } else {
            bodyElement.classList.remove('light-theme');
            themeToggleButton.textContent = 'Switch to Light Mode';
        }
        localStorage.setItem('quizTheme', theme);
    }

    function loadQuiz() {
        quizData.forEach((qData, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `q${index}`;

            const loText = document.createElement('div');
            loText.classList.add('learning-objective');
            loText.textContent = qData.learningObjective;
            questionBlock.appendChild(loText);

            const questionText = document.createElement('p');
            questionText.classList.add('question-text');
            questionText.innerHTML = `${index + 1}. ${qData.question}`;
            questionBlock.appendChild(questionText);

            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');

            for (const optionKey in qData.options) {
                const optionId = `q${index}_${optionKey}`;
                const label = document.createElement('label');
                label.htmlFor = optionId;
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = `q${index}`;
                radioInput.value = optionKey;
                radioInput.id = optionId;
                const labelText = document.createElement('span');
                labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                label.appendChild(radioInput);
                label.appendChild(labelText);
                optionsDiv.appendChild(label);
            }
            questionBlock.appendChild(optionsDiv);

            const buttonContainer = document.createElement('div');
            buttonContainer.classList.add('button-container');

            const checkButton = document.createElement('button');
            checkButton.textContent = 'Check Answer';
            checkButton.classList.add('check-button');
            checkButton.onclick = () => checkAnswer(index);
            buttonContainer.appendChild(checkButton);
            
            questionBlock.appendChild(buttonContainer);

            const feedbackDiv = document.createElement('div');
            feedbackDiv.classList.add('feedback');
            questionBlock.appendChild(feedbackDiv);

            quizContainer.appendChild(questionBlock);
        });
    }

    function checkAnswer(questionIndex) {
        const questionBlockElement = document.getElementById(`q${questionIndex}`);
        const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

        if (!selectedRadioButton) {
            alert("Please select an answer first.");
            return;
        }

        const selectedOptionKey = selectedRadioButton.value;
        const qData = quizData[questionIndex];
        const feedbackDiv = questionBlockElement.querySelector('.feedback');
        const correct = selectedOptionKey === qData.correctAnswer;

        let feedbackHTML = '';

        if (correct) {
            feedbackHTML = `<span class="feedback-status">Correct!</span>`;
            feedbackDiv.className = 'feedback correct';
        } else {
             feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
            feedbackDiv.className = 'feedback incorrect';
        }

        feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
        feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
        feedbackDiv.innerHTML = feedbackHTML;
    }

    themeToggleButton.addEventListener('click', () => {
        if (bodyElement.classList.contains('light-theme')) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('quizTheme') || 'dark';
        applyTheme(savedTheme);
        loadQuiz();
    });

</script>
